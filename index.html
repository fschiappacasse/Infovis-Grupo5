<!doctype html>
<html>

<head>
  <meta charset="utf-8" />
  <script src="https://cdn.plot.ly/plotly-2.30.0.min.js"></script>
  <style>
    body {
      font-family: system-ui, Segoe UI, Roboto, Helvetica, Arial
    }
  </style>
</head>

<body>
  <script src="https://app.protobject.com/framework/p.js"></script>
  <script src="config.js"></script>
  <div style="display:flex;gap:20px;align-items:flex-start;margin-top:2%;margin-left:3%;max-width:90%;">
    <!-- Gráfico -->
    <div id="chart" style="flex:0 0 70%;height:600px;border:1px solid #ccc;"></div>

    <!-- Muestras de audio por país (pueden estar hidden) -->
    <audio id="audio-Chile" src="audio/chile_top5_mix.mp3"></audio>
    <audio id="audio-Argentina" src="audio/argentina_top5_mix.mp3"></audio>
    <audio id="audio-Uruguay" src="audio/uruguay_top5_mix.mp3"></audio>
    <audio id="audio-Perú" src="audio/peru_top5_mix.mp3"></audio>
    <audio id="audio-Colombia" src="audio/colombia_top5_mix.mp3"></audio>


    <!-- Selector y top 5 -->
    <div style="flex:0 0 30%;padding:12px;border:1px solid #ccc;">
      <h2 style="margin-top:0;font-weight:normal;">Ver el top 5 histórico de canciones de trap </h2>
      <h5 style="margin-top:0;font-weight:normal;">💡 Haz click en una línea para ver y escuchar el trap de ese país
      </h5>
      <select id="countrySelector" style="width:100%;padding:6px;font-size:14px;margin-bottom:16px;">
        <option value="Chile">Chile</option>
        <option value="Argentina">Argentina</option>
        <option value="Uruguay">Uruguay</option>
        <option value="Perú">Perú</option>
        <option value="Colombia">Colombia</option>
      </select>
      <ul id="top5List" style="list-style:none;padding-left:0;margin:0;"></ul>
    </div>
  </div>

  <div id="countryToggles" style="margin-left:3%; margin-top:8px; font-size:14px;">
    <strong>Mostrar países:</strong>
    <label style="margin-left:8px;">
      <input type="checkbox" class="countryToggle" value="Chile" checked> Chile
    </label>
    <label style="margin-left:8px;">
      <input type="checkbox" class="countryToggle" value="Argentina" checked> Argentina
    </label>
    <label style="margin-left:8px;">
      <input type="checkbox" class="countryToggle" value="Uruguay" checked> Uruguay
    </label>
    <label style="margin-left:8px;">
      <input type="checkbox" class="countryToggle" value="Perú" checked> Perú
    </label>
    <label style="margin-left:8px;">
      <input type="checkbox" class="countryToggle" value="Colombia" checked> Colombia
    </label>
  </div>

  <ul id="top5List" style="list-style:none;padding-left:0;margin:0;"></ul>


  <script>
    const files2 = {
      "Argentina": "data/ar_top10_trap.csv",
      "Perú": "data/pe_top10_trap.csv",
      "Uruguay": "data/ur_top10_trap.csv",
      "Colombia": "data/col_top10_trap.csv",
      "Chile": "data/cl_top10_trap.csv"
    };



    async function loadTop5CSV(country) {
      const url = files2[country];
      const text = await fetch(url).then(r => r.text());
      const rows = text.trim().split(/\r?\n/).map(r => r.split(";"));
      const headers = rows.shift().map(h => h.trim().toLowerCase());
      const titleIndex = headers.indexOf("title");
      const artistIndex = headers.indexOf("artist");
      const dateIndex = headers.indexOf("date");
      const top5 = rows.slice(0, 5);

      const list = document.getElementById("top5List");
      list.innerHTML = "";
      top5.forEach((row, idx) => {
        let year;
        const date = row[dateIndex].trim();
        year = (country === "Argentina") ? date.split("-")[2] : date.split("-")[0];
        const li = document.createElement("li");
        li.style.marginBottom = "8px";
        li.innerHTML = `${idx + 1}) <strong>${row[titleIndex]}</strong> (${year}) — ${row[artistIndex]}`;
        list.appendChild(li);
      });
    }

    const selector = document.getElementById("countrySelector");
    selector.addEventListener("change", (e) => loadTop5CSV(e.target.value));
    loadTop5CSV("Chile");
  </script>

  <div id="sonic" style="max-width:60%;margin:24px auto 0;margin-left:3%;">
    <h2 style="margin-top:0;font-weight:normal;">Sonificación</h2>
    <div style="display:flex;flex-wrap:wrap;gap:20px;align-items:flex-end;margin-top:16px;">
      <div>
        <h5 style="margin:0 0 6px 0;font-weight:normal;">Selecciona un país</h5>
        <select id="countryOrder"
          style="min-width:220px;width:100%;padding:8px;font-size:14px;border:1px solid #ccc;border-radius:6px;background:#fff;">
          <option value="Chile" selected>Chile</option>
          <option value="Argentina">Argentina</option>
          <option value="Uruguay">Uruguay</option>
          <option value="Perú">Perú</option>
          <option value="Colombia">Colombia</option>
        </select>
      </div>
      <div>
        <h5 style="margin:0 0 6px 0;font-weight:normal;">Volumen</h5>
        <input id="vol" type="range" min="-30" max="0" step="1" value="-10" style="width:120px;accent-color:#444;">
      </div>
    </div>
    <div id="nowPlaying" style="margin-top:8px;color:#555;"></div>
  </div>


  <script>
    const files = {
      "Argentina": "data/ar_trap_monthly_counts.csv",
      "Perú": "data/pe_trap_monthly_counts.csv",
      "Uruguay": "data/ur_trap_monthly_counts.csv",
      "Colombia": "data/col_trap_monthly_counts.csv",
      "Chile": "data/cl_trap_monthly_counts.csv"
    };

    const COLORS = {
      "Chile": "#f67278",
      "Argentina": "#dbcdf0",
      "Uruguay": "#c6def1",
      "Perú": "#c9e4de",
      "Colombia": "#faedcb"
    };

    function ymToDate(y, m) { return new Date(+y, +m - 1, 1); }

    function formatMonthYearEs(date) {
      const meses = [
        "Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio",
        "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"
      ];
      return `${meses[date.getMonth()]} ${date.getFullYear()}`;
    }


    function makePctToFreq(minPct, maxPct) {
      const lo = (minPct === maxPct) ? minPct - 0.001 : minPct;
      const hi = (minPct === maxPct) ? maxPct + 0.001 : maxPct;
      const fMin = 174.61, fMax = 880.00;
      const gamma = 0.6;
      return function pctToFreq(p) {
        const t0 = (p - lo) / (hi - lo);
        const t = Math.min(1, Math.max(0, Math.pow(t0, gamma)));
        return fMin * Math.pow(fMax / fMin, t);
      };
    }

    async function loadCSV(url) {
      const text = await fetch(url).then(r => r.text());
      const rows = text.trim().split(/\r?\n/).map(r => r.split(","));
      const hdr = rows.shift().map(s => s.trim().toLowerCase());
      const yi = hdr.indexOf("year"), mi = hdr.indexOf("month"), pi = hdr.indexOf("pct_trap_avg");
      return rows.map(r => ({ date: ymToDate(r[yi], r[mi]), pct: +r[pi] }))
        .filter(d => d.date >= new Date(2017, 0, 1) && d.date < new Date(2022, 0, 1))
        .sort((a, b) => a.date - b.date);
    }

    (async () => {
      const annotations = [];
      const traces = [];

      let chilePeakAnnIndex = null;

      for (const [country, path] of Object.entries(files)) {
        const data = await loadCSV(path);
        const color = COLORS[country] || "#444";

        traces.push({
          name: country,
          x: data.map(d => d.date),
          y: data.map(d => d.pct),
          mode: "lines",
          line: { color, width: 2 },
          opacity: 0.95,
          showlegend: false,
          text: data.map(d => formatMonthYearEs(d.date)),
          hovertemplate: "%{text}, %{y:.0f}%%<extra></extra>"
        });



        const first = data[0], last = data[data.length - 1];

        if (first && last) {
          traces.push({
            hoverinfo: "skip",
            name: country + " (2017/2021)",
            x: [first.date, last.date],
            y: [first.pct, last.pct],
            mode: "markers",
            marker: { size: 3, line: { width: 2, color }, color },
            showlegend: false,
            text: [formatMonthYearEs(first.date), formatMonthYearEs(last.date)],
            hovertemplate: "%{text}, %{y:.0f}%%<extra></extra>"
          });

          traces.push({
            name: country,
            x: [null], y: [null],
            mode: "lines",
            line: { color, width: 3 },
            showlegend: true
          });
        }

        if (country === "Chile" && data.length) {
          const peak = data.reduce((a, b) => (b.pct > a.pct ? b : a), data[0]);
          annotations.push({
            x: peak.date, y: peak.pct,
            xref: "x", yref: "y",
            xanchor: "left", yanchor: "bottom",
            text: `Un ${peak.pct.toFixed(1)}% del top 50 de Chile en Marzo 2020 fue música trap`,
            font: { color, size: 12 },
            showarrow: true, arrowcolor: color, ax: -120, ay: -50,
            bgcolor: "rgba(255,255,255,0.85)", bordercolor: color
          });

          chilePeakAnnIndex = annotations.length - 1;
        }
      }

      // === Cursor como TRACE de línea (debajo del marcador) ===
      const CURSOR_TRACE_IDX = traces.length;
      traces.push({
        name: "_cursor",
        x: [new Date(2017, 0, 1), new Date(2017, 0, 1)],
        y: [0, 100],
        mode: "lines",
        line: { width: 2, dash: "dot", color: "#222" },
        hoverinfo: "skip",
        showlegend: false
      });

      // === Marcador de reproducción ===
      const PLAY_MARKER_TRACE = traces.length;
      traces.push({
        name: "_playhead",
        x: [null], y: [null],
        mode: "markers",
        marker: { size: 14, color: "#111", line: { width: 2, color: "#fff" }, opacity: 1 },
        hoverinfo: "skip",
        showlegend: false
      });

      // etiquetas al final de cada serie (opcional, conservadas)
      function darkenColor(hex, factor = 0.7) {
        const r = Math.floor(parseInt(hex.substr(1, 2), 16) * factor);
        const g = Math.floor(parseInt(hex.substr(3, 2), 16) * factor);
        const b = Math.floor(parseInt(hex.substr(5, 2), 16) * factor);
        return `rgb(${r},${g},${b})`;
      }
      const yOffsets = { "Chile": 0, "Argentina": 10, "Uruguay": -10, "Perú": 0, "Colombia": 0 };
      const countryAnnotations = traces
        .filter(tr => tr.mode === "lines" && tr.name && !tr.name.startsWith("_") && tr.x?.length && tr.x[0] !== null)
        .map(tr => {
          const last = tr.x.length - 1;
          return {
            x: tr.x[last], y: tr.y[last],
            xref: 'x', yref: 'y', text: tr.name, showarrow: false,
            font: { color: darkenColor(tr.line.color, 0.7), size: 12 },
            xanchor: 'left', yanchor: 'middle', yshift: (yOffsets[tr.name] || 0), xshift: 5
          };
        });

      // Mapa país -> índice de su annotation de etiqueta (direct labeling)
      const labelAnnotationIndexByCountry = {};
      const baseAnnCount = annotations.length; // p.ej. la anotación del peak de Chile

      countryAnnotations.forEach((ann, idx) => {
        const baseName = (ann.text || "").split(" (")[0]; // debería ser "Chile", "Argentina", etc.
        labelAnnotationIndexByCountry[baseName] = baseAnnCount + idx;
      });


      await Plotly.newPlot("chart", traces, {
        showlegend: true,
        hoverinfo: "skip",
        uirevision: "lock",

        plot_bgcolor: "#ffffff",
        paper_bgcolor: "#ffffff",

        title: {
          text:
            "Evolución de la popularidad del trap en Chile entre 2017 – 2021" +
            "<br><span style='font-size:14px;color:#555;font-weight:400;'>Porcentaje de canciones de trap en el Top 50 mensual de Spotify en distintos países de Latinoamérica</span>",
          x: 0.5, xanchor: "center",
          font: { size: 22, family: "Segoe UI Bold, Arial, sans-serif", color: "#111" }
        },

        annotations: [...annotations, ...countryAnnotations],

        xaxis: {
          title: { text: "Año", standoff: 200 },
          tickformat: "%Y",
          dtick: "M12",
          range: [new Date(2016, 11, 11), new Date(2022, 1, 28)],
          showgrid: true,
          gridcolor: "rgba(0,0,0,0.08)",
          gridwidth: 1,
          zeroline: false
        },

        yaxis: {
          title: { text: "Porcentaje canciones de trap", standoff: 200 },
          range: [0, 100],
          tickmode: "linear",
          tick0: 0,
          dtick: 10,
          tickformat: ".0f",
          ticksuffix: "%",
          showgrid: true,
          gridcolor: "rgba(0,0,0,0.08)",
          gridwidth: 1,
          zeroline: false
        },
        legend: { title: { text: "País" }, orientation: "h", x: 0.5, y: -0.05, xanchor: "center", itemclick: false, itemdoubleclick: false },
        margin: { l: 80, r: 80, t: 100, b: 30 }
      }, { responsive: true });

      // === Helpers: mover/limpiar playhead con UN SOLO restyle ===
      const gd = document.getElementById("chart");
      window.movePlayhead = function (date, pct, color) {
        Plotly.restyle(gd, {
          x: [[date, date], [date]],   // cursor, marker
          y: [[0, 100], [pct]],
          "marker.color": [null, color]
        }, [CURSOR_TRACE_IDX, PLAY_MARKER_TRACE]);
      };
      window.clearPlayhead = function () {
        Plotly.restyle(gd, { x: [[null, null], [null]], y: [[0, 100], [null]] }, [CURSOR_TRACE_IDX, PLAY_MARKER_TRACE]);
      };

      // === Mostrar / ocultar países con checkboxes ===
      window.setCountryVisible = function(country, isVisible) {
        const indices = [];

        gd.data.forEach((tr, idx) => {
          const n = tr.name;
          if (!n || n.startsWith("_")) return; // ignora cursor y playhead

          const baseName = n.split(" (")[0];
          if (baseName === country) {
            indices.push(idx);
          }
        });

        if (indices.length) {
          Plotly.restyle(gd, { visible: isVisible }, indices);
        }

        // 👉 también actualizar visibilidad de la etiqueta al final de la línea
        const annIdx = labelAnnotationIndexByCountry[country];
        if (annIdx !== undefined) {
          const annUpdate = {};
          annUpdate[`annotations[${annIdx}].visible`] = isVisible;
          Plotly.relayout(gd, annUpdate);
        }

        if (country === "Chile" && chilePeakAnnIndex !== null) {
          const peakUpdate = {};
          peakUpdate[`annotations[${chilePeakAnnIndex}].visible`] = isVisible;
          Plotly.relayout(gd, peakUpdate);
        }
      }


      const toggleContainer = document.getElementById("countryToggles");
      if (toggleContainer) {
        toggleContainer.addEventListener("change", function (e) {
          const target = e.target;
          if (!target || !target.classList.contains("countryToggle")) return;

          const country = target.value;
          const isVisible = target.checked; // true → mostrar, false → ocultar
          setCountryVisible(country, isVisible);
        });
      }


      gd.on("plotly_hover", function (evt) {
        const pt = evt.points && evt.points[0];
        if (!pt) return;

        let name = pt.data.name || "";
        if (!name || name.startsWith("_")) return; // ignora cursor/playhead

        const baseName = name.includes(" (") ? name.split(" (")[0] : name;

        // panel derecho (top 5)
        if (!files2[baseName]) return;

        const sel = document.getElementById("countrySelector");
        if (sel && sel.value !== baseName) {
          sel.value = baseName;
        }
        loadTop5CSV(baseName);

        // selector de sonificación
        const selOrder = document.getElementById("countryOrder");
        if (selOrder && selOrder.value !== baseName) {
          selOrder.value = baseName;
        }

        // 👉 reproducir muestra de audio de ese país
        playSampleForCountry(baseName);
      });

      gd.on("plotly_click", function (evt) {
        const pt = evt.points && evt.points[0];
        if (!pt) return;

        let name = pt.data.name || "";
        if (!name || name.startsWith("_")) return;

        const baseName = name.includes(" (") ? name.split(" (")[0] : name;

        if (!files[baseName]) return;

        const selOrder = document.getElementById("countryOrder");
        if (selOrder && selOrder.value !== baseName) {
          selOrder.value = baseName;
        }
        playSampleForCountry(baseName);
      });




    })();
  </script>

  <script>
    // Referencias UI
    const volSlider = document.getElementById("vol");
    const nowPlaying = document.getElementById("nowPlaying");
    const countryOrderSelect = document.getElementById("countryOrder");

    let currentAudio = null;

    // Mapa de país → elemento <audio>
    const AUDIO_BY_COUNTRY = {
      "Chile": document.getElementById("audio-Chile"),
      "Argentina": document.getElementById("audio-Argentina"),
      "Uruguay": document.getElementById("audio-Uruguay"),
      "Perú": document.getElementById("audio-Perú"),
      "Colombia": document.getElementById("audio-Colombia")
    };

    // Volumen global (0 a 1)
    function setGlobalVolumeFromSlider() {
      const v = Number(volSlider.value);     // -30 a 0
      const minDb = -30, maxDb = 0;
      const t = (v - minDb) / (maxDb - minDb);
      const volume = Math.max(0, Math.min(1, t));

      for (const audio of Object.values(AUDIO_BY_COUNTRY)) {
        audio.volume = volume;
      }
    }

    volSlider.addEventListener("input", setGlobalVolumeFromSlider);
    setGlobalVolumeFromSlider(); // inicial

    function stopSample() {
      if (currentAudio) {
        currentAudio.pause();
        currentAudio.currentTime = 0;
        currentAudio = null;
        nowPlaying.textContent = "⏹ Detenido";
      }
    }

    function playSampleForCountry(country) {
      const audio = AUDIO_BY_COUNTRY[country];
      if (!audio) {
        nowPlaying.textContent = `No hay muestra de audio para ${country}`;
        return;
      }

      // Si ya está sonando este mismo país, no reiniciamos
      if (currentAudio === audio && !audio.paused) {
        return;
      }

      // Si había otro país sonando, lo detenemos
      stopSample();

      currentAudio = audio;
      countryOrderSelect.value = country; // sincronizar selector
      nowPlaying.textContent = `▶ Escuchando muestra de ${country}`;
      audio.loop = true;
      audio.play().catch(err => {
        console.error("Error al reproducir audio:", err);
        nowPlaying.textContent = "⚠️ No se pudo reproducir el audio";
      });
    }

  </script>

  <script>

function isPointInPolygon(point, polygon) {
  let inside = false;
  const x = point.x, y = point.y;

  for (let i = 0, j = polygon.length - 1; i < polygon.length; j = i++) {
    const xi = polygon[i].x, yi = polygon[i].y;
    const xj = polygon[j].x, yj = polygon[j].y;

    const intersect =
      ((yi > y) !== (yj > y)) &&
      (x < ((xj - xi) * (y - yi)) / (yj - yi) + xi);

    if (intersect) inside = !inside;
  }

  return inside;
}

function findCountry(point) {

  // Polígonos
  const chile = [
    { x: 0.388, y: 0.471 },
    { x: 0.35, y: 0.52 },
    { x: 0.384, y: 0.731 },
    { x: 0.4047, y: 0.709 }
  ];

  const argentina = [
    { x: 0.407, y: 0.4933 },
    { x: 0.5340, y: 0.5020 },
    { x: 0.50,  y: 0.6185 },
    { x: 0.4994,y: 0.6077 },
    { x: 0.4511,y: 0.7239 }
  ];

  const uruguay = [
    { x: 0.5218, y: 0.5622 },
    { x: 0.549,  y: 0.582 },
    { x: 0.519,  y: 0.590 },
    { x: 0.524,  y: 0.606 }
  ];

  const peru = [
    { x: 0.26, y: 0.34 },
    { x: 0.35, y: 0.356 },
    { x: 0.28, y: 0.384 },
    { x: 0.38, y: 0.42 },
    { x: 0.38, y: 0.47 },
    { x: 0.27, y: 0.44 },
    { x: 0.24, y: 0.40 }
  ];

  const colombia = [
    { x: 0.29, y: 0.26 },
    { x: 0.35, y: 0.29 },
    { x: 0.34, y: 0.35 },
    { x: 0.285, y: 0.34 }

  ];

  const countries = [
    { name: "Chile", polygon: chile },
    { name: "Argentina", polygon: argentina },
    { name: "Uruguay", polygon: uruguay },
    { name: "Perú", polygon: peru },
    { name: "Colombia", polygon: colombia }
  ];

  for (const country of countries) {
    if (isPointInPolygon(point, country.polygon)) {
      console.log("País detectado:", country.name);
      return country.name;
    }
  }

  return null;
}


let mapaCooldown = false;
let ultimoPaisDetectado = null;
let pais_seleccionado = null;

Protobject.Core.onReceived((data) => {
  if (mapaCooldown) return; 

  const point = { x: data.x, y: data.y };
  let detectedCountry = findCountry(point);


  if (!detectedCountry) {
    console.log("País nulo, usando último país:", ultimoPaisDetectado);
    detectedCountry = ultimoPaisDetectado;
  }

  if (!detectedCountry) return;

  if (pais_seleccionado === detectedCountry) return;

  pais_seleccionado = detectedCountry;
  ultimoPaisDetectado = detectedCountry;

  console.log("País detectado (final):", detectedCountry);


  // actualizar selector
  const selector = document.getElementById("countrySelector");
  selector.value = detectedCountry;
  loadTop5CSV(detectedCountry);

  const orderSelect = document.getElementById("countryOrder");
  orderSelect.value = detectedCountry;

  //sonificacion
  playSampleForCountry(detectedCountry);


  // mostrar en mapa
  const selected = detectedCountry;

  const checkboxes = document.querySelectorAll(".countryToggle");
  checkboxes.forEach((cb) => {
    cb.checked = cb.value === selected;
    setCountryVisible(cb.value, cb.value === selected);
  });


  mapaCooldown = true;
  setTimeout(() => {
    mapaCooldown = false;
  }, 350); 

});

</script>


</body>

</html>
