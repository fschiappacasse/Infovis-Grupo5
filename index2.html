<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hand Sensor - Clasificación de Países</title>
  <style>
    #finger-triangle {
      position: absolute;
      width: 0;
      height: 0;
      border-left: 10px solid transparent;
      border-right: 10px solid transparent;
      border-bottom: 20px solid red;
      display: none;
      pointer-events: none;
      z-index: 9999;
    }
    #InfoBox {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0,0,0,0.6);
      color: white;
      padding: 8px 12px;
      border-radius: 5px;
      font-family: sans-serif;
    }
  </style>
</head>
<body>
  <div id="InfoBox"></div>
  <div id="finger-triangle"></div>

  <script src="https://app.protobject.com/framework/p.js"></script>
  <script>
    // --- Configuración de Protobject ---
    Protobject.setProduction(false);
    Protobject.initialize([
      {
        name: "Hand",
        page: "hand.html",
        connection: "channel", // más estable que auto
      },
      {
        name: "Graph",
        page: "index.html",
        main: true,
      },
    ]);

    // --- Triángulo que sigue la mano ---
    const triangle = document.getElementById("finger-triangle");

    function updateTrianglePosition(lat, lng) {
      const point = map.latLngToContainerPoint([lat, lng]);
      triangle.style.left = `${point.x - 10}px`;
      triangle.style.top = `${point.y - 20}px`;
      triangle.style.display = 'block';
    }

    // --- Definición de zonas (países) ---
    const zonas = {
      argentina: { latRange: [-55, -21], lngRange: [-73, -53], info: "Argentina 🇦🇷" },
      uruguay: { latRange: [-35.6, -30.1], lngRange: [-58.5, -53.1], info: "Uruguay 🇺🇾" },
      chile: { latRange: [-56, -17], lngRange: [-76, -66], info: "Chile 🇨🇱" },
      colombia: { latRange: [-4, 12.5], lngRange: [-79, -66], info: "Colombia 🇨🇴" },
    };

    function estaCercaDeZona(lat, lng, zona) {
      return lat >= zona.latRange[0] && lat <= zona.latRange[1] &&
             lng >= zona.lngRange[0] && lng <= zona.lngRange[1];
    }

    let audioActivo = null;

    // --- Función para mapear valores normalizados 0..1 a lat/lng ---
    function mapValue(value, inMin, inMax, outMin, outMax) {
      return ((value - inMin) * (outMax - outMin)) / (inMax - inMin) + outMin;
    }

    // --- Recibir datos del sensor de Protobject ---
    Protobject.Core.onReceived((data) => {
      // Convierte valores normalizados a lat/lng reales
      const lat = mapValue(data.y, 0, 1, map.getBounds().getNorth(), map.getBounds().getSouth());
      const lng = mapValue(data.x, 0, 1, map.getBounds().getWest(), map.getBounds().getEast());

      // Actualiza triángulo
      updateTrianglePosition(lat, lng);

      // Detectar zona/pais
      let zonaDetectada = null;
      if (estaCercaDeZona(lat, lng, zonas.argentina)) zonaDetectada = zonas.argentina;
      else if (estaCercaDeZona(lat, lng, zonas.uruguay)) zonaDetectada = zonas.uruguay;
      else if (estaCercaDeZona(lat, lng, zonas.chile)) zonaDetectada = zonas.chile;
      else if (estaCercaDeZona(lat, lng, zonas.colombia)) zonaDetectada = zonas.colombia;

      // Mostrar info y reproducir audio
      const infoBox = document.getElementById("InfoBox");
      if (zonaDetectada) {
        infoBox.innerText = zonaDetectada.info;

        if (!audioActivo || audioActivo.src !== zonaDetectada.audioUrl) {
          if (audioActivo) audioActivo.pause();
          if (zonaDetectada.audioUrl) {
            audioActivo = new Audio(zonaDetectada.audioUrl);
            audioActivo.loop = true;
            audioActivo.play();
          }
        }

      } else {
        infoBox.innerText = "";
        if (audioActivo) { audioActivo.pause(); audioActivo = null; }
      }
    });
  </script>
</body>
</html>
